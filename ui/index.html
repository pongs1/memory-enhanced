<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Memory Graph 3D Demo</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js"
      }
    }
  </script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #060912;
      --bg-strong: rgba(10, 14, 28, 0.72);
      --bg-soft: rgba(11, 16, 31, 0.56);
      --border: rgba(118, 148, 225, 0.16);
      --text: #edf3ff;
      --muted: #8fa4d5;
      --accent: #87b7ff;
      --accent-soft: rgba(135, 183, 255, 0.18);
      --evolution: #ff9f5d;
      --episodic: #59e0a3;
      --semantic: #71a0ff;
      --procedural: #c18cff;
      --shadow: 0 32px 90px rgba(0, 0, 0, 0.42);
      --drawer-w: 336px;
      --panel-radius: 22px;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 18%, rgba(64, 99, 255, 0.28), transparent 22%),
        radial-gradient(circle at 74% 22%, rgba(103, 68, 210, 0.22), transparent 21%),
        radial-gradient(circle at 64% 72%, rgba(255, 133, 71, 0.16), transparent 24%),
        radial-gradient(circle at 50% 58%, rgba(39, 64, 144, 0.28), transparent 38%),
        linear-gradient(180deg, #07101f 0%, #04070e 100%);
      color: var(--text);
      font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
    }

    body { position: relative; }
    #scene {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 34% 60%, rgba(70, 118, 255, 0.26), transparent 20%),
        radial-gradient(circle at 49% 54%, rgba(160, 100, 255, 0.18), transparent 16%),
        radial-gradient(circle at 57% 57%, rgba(255, 144, 91, 0.16), transparent 20%),
        radial-gradient(circle at 45% 50%, rgba(58, 95, 189, 0.20), transparent 30%);
    }
    canvas { display: block; }

    .glass {
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: var(--bg-strong);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    #control-cluster {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      gap: 10px;
      padding: 10px;
      border-radius: 24px;
      z-index: 10;
      background: rgba(7, 12, 24, 0.54);
      transform: scale(0.94);
      transform-origin: top left;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 18px;
      background: rgba(14, 19, 37, 0.72);
      border: 1px solid rgba(125, 151, 226, 0.10);
    }

    .control-label {
      font-family: system-ui, sans-serif;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }

    .chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .chip {
      border: 0;
      border-radius: 999px;
      padding: 6px 10px;
      font-family: system-ui, sans-serif;
      font-size: 12px;
      color: #b8c8ef;
      background: rgba(22, 28, 49, 0.92);
      cursor: pointer;
      transition: 0.18s ease;
      box-shadow: inset 0 0 0 1px rgba(129, 157, 226, 0.10);
    }

    .chip.active {
      background: var(--accent-soft);
      color: #dcebff;
      box-shadow: inset 0 0 0 1px rgba(135, 183, 255, 0.22), 0 0 20px rgba(84, 129, 255, 0.16);
    }

    .chip.mode-dynamic.active {
      color: #d35b3d;
      background: rgba(255, 141, 92, 0.14);
      box-shadow: inset 0 0 0 1px rgba(255, 141, 92, 0.18);
    }

    #search-wrap {
      position: relative;
      min-width: 220px;
    }

    #search {
      width: 100%;
      border: 0;
      outline: 0;
      border-radius: 999px;
      padding: 10px 14px;
      background: rgba(11, 16, 31, 0.94);
      font-family: system-ui, sans-serif;
      font-size: 13px;
      color: var(--text);
      box-shadow: inset 0 0 0 1px rgba(129, 157, 226, 0.12);
    }

    #search-results {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      display: none;
      flex-direction: column;
      gap: 6px;
      max-height: 260px;
      overflow: auto;
      padding: 10px;
      border-radius: 18px;
      z-index: 11;
    }

    #search-results.visible { display: flex; }

    .search-item {
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(12, 18, 34, 0.94);
      border: 1px solid rgba(125, 151, 226, 0.10);
      cursor: pointer;
      transition: 0.18s ease;
    }

    .search-item:hover {
      transform: translateY(-1px);
      background: rgba(16, 22, 42, 0.98);
    }

    .search-title {
      font-family: system-ui, sans-serif;
      font-size: 13px;
      color: var(--text);
    }

    .search-subtitle {
      margin-top: 4px;
      font-family: system-ui, sans-serif;
      font-size: 11px;
      color: var(--muted);
    }

    #drawer {
      position: absolute;
      top: 0;
      right: 0;
      width: var(--drawer-w);
      height: 100%;
      padding: 18px 18px 18px 14px;
      z-index: 9;
      pointer-events: none;
    }

    #drawer-panel {
      width: 100%;
      height: 100%;
      border-radius: 28px 0 0 28px;
      overflow: auto;
      padding: 22px 20px 24px;
      pointer-events: auto;
      background: linear-gradient(180deg, rgba(9, 13, 26, 0.78), rgba(8, 12, 24, 0.88));
    }

    .eyebrow {
      font-family: system-ui, sans-serif;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.13em;
      color: var(--muted);
    }

    #node-title {
      margin-top: 10px;
      font-size: 28px;
      line-height: 1.1;
      letter-spacing: -0.03em;
    }

    .badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
      margin-bottom: 20px;
    }

    .badge {
      padding: 6px 10px;
      border-radius: 999px;
      font-family: system-ui, sans-serif;
      font-size: 12px;
      background: rgba(15, 21, 40, 0.88);
      border: 1px solid rgba(125, 151, 226, 0.10);
      color: #c3d1f3;
    }

    .section {
      margin-top: 14px;
      padding: 16px;
      border-radius: var(--panel-radius);
      background: rgba(12, 18, 34, 0.74);
      border: 1px solid rgba(125, 151, 226, 0.10);
    }

    .section h3 {
      margin: 0 0 10px;
      font-size: 14px;
      font-family: system-ui, sans-serif;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.10em;
    }

    .summary {
      margin: 0;
      font-size: 15px;
      line-height: 1.65;
      font-family: system-ui, sans-serif;
      color: #d9e6ff;
    }

    .meta-list {
      display: grid;
      gap: 8px;
    }

    .meta-row {
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(16, 22, 42, 0.92);
    }

    .meta-key {
      font-family: system-ui, sans-serif;
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .meta-value {
      margin-top: 4px;
      font-family: system-ui, sans-serif;
      font-size: 13px;
      color: var(--text);
      line-height: 1.45;
      word-break: break-word;
    }

    .jump-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .jump-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 12px 14px;
      border-radius: 16px;
      border: 0;
      background: rgba(16, 22, 42, 0.92);
      cursor: pointer;
      text-align: left;
      transition: 0.18s ease;
    }

    .jump-item:hover {
      transform: translateY(-1px);
      background: rgba(22, 30, 56, 0.96);
    }

    .jump-title {
      font-family: system-ui, sans-serif;
      font-size: 13px;
      color: var(--text);
    }

    .jump-subtitle {
      margin-top: 4px;
      font-family: system-ui, sans-serif;
      font-size: 11px;
      color: var(--muted);
    }

    .jump-cta {
      font-family: system-ui, sans-serif;
      font-size: 12px;
      color: var(--accent);
      white-space: nowrap;
    }

    .rail {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 4px;
    }

    .rail-item {
      position: relative;
      padding-left: 22px;
      font-family: system-ui, sans-serif;
      font-size: 13px;
      color: #d4e2ff;
    }

    .rail-item::before {
      content: "";
      position: absolute;
      left: 0;
      top: 6px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(146, 169, 231, 0.34);
      box-shadow: 0 0 0 4px rgba(94, 126, 216, 0.12);
    }

    .rail-item.active::before {
      background: var(--evolution);
      box-shadow: 0 0 0 5px rgba(255, 141, 92, 0.14);
    }

    .rail-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 3px;
    }

    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      font-size: 14px;
      color: var(--muted);
      background: rgba(5, 8, 16, 0.72);
      backdrop-filter: blur(4px);
      z-index: 12;
    }

    @media (max-width: 1080px) {
      :root { --drawer-w: 320px; }
      #control-cluster {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div id="scene"></div>
  <div id="loading">Loading 3D memory graph demo...</div>

  <div id="control-cluster" class="glass">
    <div class="control-group">
      <div class="control-label">Layer</div>
      <div class="chips" id="layer-chips">
        <button class="chip active" data-layer="all">all</button>
        <button class="chip" data-layer="episodic">episodic</button>
        <button class="chip" data-layer="semantic">semantic</button>
        <button class="chip" data-layer="procedural">procedural</button>
      </div>
    </div>

    <div class="control-group">
      <div class="control-label">View</div>
      <div class="chips" id="view-chips">
        <button class="chip active" data-view="hybrid">hybrid</button>
        <button class="chip" data-view="semantic">semantic</button>
        <button class="chip" data-view="evolution">evolution</button>
      </div>
    </div>

    <div class="control-group">
      <div class="control-label">Mode</div>
      <div class="chips" id="mode-chips">
        <button class="chip active" data-mode="static">static</button>
        <button class="chip mode-dynamic" data-mode="dynamic">dynamic</button>
      </div>
    </div>

    <div class="control-group">
      <div class="control-label">Search</div>
      <div id="search-wrap">
        <input id="search" type="text" placeholder="find node / memory" />
        <div id="search-results" class="glass"></div>
      </div>
    </div>
  </div>

  <aside id="drawer">
    <div id="drawer-panel" class="glass">
      <div class="eyebrow">Selected Node</div>
      <div id="node-title">Memory Graph</div>
      <div class="badges" id="badges"></div>

      <section class="section">
        <h3>Semantic Summary</h3>
        <p class="summary" id="semantic-summary">
          Select a node to inspect its memory meaning, evidence context, evolution position, and related jumps.
        </p>
      </section>

      <section class="section">
        <h3>Evidence &amp; Memory</h3>
        <div class="meta-list" id="memory-meta"></div>
      </section>

      <section class="section">
        <h3>Related Connections</h3>
        <div class="jump-list" id="jump-list"></div>
      </section>

      <section class="section">
        <h3>State / Evolution Context</h3>
        <div class="rail" id="state-rail"></div>
      </section>
    </div>
  </aside>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.170.0/build/three.module.js";
    import { OrbitControls } from "https://unpkg.com/three@0.170.0/examples/jsm/controls/OrbitControls.js";

    const sceneEl = document.getElementById("scene");
    const loadingEl = document.getElementById("loading");
    const searchEl = document.getElementById("search");
    const searchResultsEl = document.getElementById("search-results");
    const badgesEl = document.getElementById("badges");
    const titleEl = document.getElementById("node-title");
    const summaryEl = document.getElementById("semantic-summary");
    const memoryMetaEl = document.getElementById("memory-meta");
    const jumpListEl = document.getElementById("jump-list");
    const stateRailEl = document.getElementById("state-rail");

    const colorByLayer = {
      episodic: 0x4fbf84,
      semantic: 0x6b8cff,
      procedural: 0xb487ff,
      unknown: 0xa8b2c9,
    };

    const state = {
      layer: "all",
      view: "hybrid",
      mode: "static",
      selectedNodeId: null,
      graph: null,
      nodeMeshes: new Map(),
      glowMeshes: new Map(),
      labelLookup: new Map(),
      lineGroups: {},
      relatedByNode: new Map(),
      evolutionGraph: { next: new Map(), prev: new Map() },
      animationClock: 0,
    };

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    sceneEl.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x040811, 0.00028);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 4000);
    camera.position.set(-18, 106, 286);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 60;
    controls.maxDistance = 800;
    controls.target.set(0, 0, 0);

    const ambient = new THREE.AmbientLight(0xbfd0ff, 0.74);
    const keyLight = new THREE.DirectionalLight(0xf1f5ff, 1.5);
    keyLight.position.set(140, 180, 120);
    const fillLight = new THREE.PointLight(0x5f87ff, 2.4, 1200);
    fillLight.position.set(-170, 20, 260);
    const warmLight = new THREE.PointLight(0xff8d5b, 1.6, 900);
    warmLight.position.set(180, -40, 360);
    scene.add(ambient, keyLight, fillLight, warmLight);

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2(-2, -2);
    const graphGroup = new THREE.Group();
    const starField = new THREE.Group();
    scene.add(starField, graphGroup);

    function hashNumber(input) {
      const text = String(input || "");
      let h = 0;
      for (let i = 0; i < text.length; i += 1) h = (h * 31 + text.charCodeAt(i)) % 1000003;
      return h;
    }

    function layerOffset(layer) {
      if (layer === "episodic") return new THREE.Vector3(-118, -22, -46);
      if (layer === "semantic") return new THREE.Vector3(18, 8, 0);
      if (layer === "procedural") return new THREE.Vector3(138, 18, 54);
      return new THREE.Vector3();
    }

    function buildEvolutionDepth(nodes, edges) {
      const next = new Map();
      const prev = new Map();
      for (const edge of edges) {
        const listNext = next.get(edge.source) || [];
        listNext.push(edge.target);
        next.set(edge.source, listNext);
        const listPrev = prev.get(edge.target) || [];
        listPrev.push(edge.source);
        prev.set(edge.target, listPrev);
      }

      const depth = new Map();
      const queue = [];
      for (const node of nodes) {
        if (!prev.has(node.id)) {
          depth.set(node.id, 0);
          queue.push(node.id);
        }
      }
      while (queue.length) {
        const current = queue.shift();
        const base = depth.get(current) || 0;
        for (const target of next.get(current) || []) {
          if (!depth.has(target) || depth.get(target) < base + 1) {
            depth.set(target, base + 1);
            queue.push(target);
          }
        }
      }

      state.evolutionGraph = { next, prev };
      return depth;
    }

    function buildPositions(nodes, evolutionEdges) {
      const depthMap = buildEvolutionDepth(nodes, evolutionEdges);
      const positions = new Map();
      const armBiasByLayer = {
        episodic: -1.35,
        semantic: -0.2,
        procedural: 0.95,
      };

      for (const node of nodes) {
        const base = layerOffset(node.layer);
        const h1 = hashNumber(node.id);
        const h2 = hashNumber(node.summary || node.id);
        const evoDepth = depthMap.get(node.id) || 0;
        const swirl = evoDepth * 0.34;
        const angle = armBiasByLayer[node.layer] + ((h1 % 240) / 240) * Math.PI * 1.2 + swirl;
        const roleAngle = (((h2 % 180) + 20) / 180) * Math.PI;
        const radius = 34 + (node.importance ?? 0.5) * 52 + (h1 % 58);
        const jitter = ((h2 % 19) - 9) * 2.2;
        const z = evoDepth * 82 + ((h1 % 21) - 10) * 5.4;
        const x = base.x + Math.cos(angle) * radius + Math.sin(roleAngle) * 34;
        const y = base.y + Math.sin(angle) * radius * 0.42 + Math.cos(roleAngle) * 22 + jitter;
        positions.set(node.id, new THREE.Vector3(x, y, z));
      }

      for (const edge of evolutionEdges) {
        const a = positions.get(edge.source);
        const b = positions.get(edge.target);
        if (a && b && Math.abs(a.z - b.z) < 24) b.z = a.z + 78;
      }
      return positions;
    }

    function makeGlowSprite(hexColor) {
      const canvas = document.createElement("canvas");
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext("2d");
      const gradient = ctx.createRadialGradient(64, 64, 10, 64, 64, 64);
      const color = new THREE.Color(hexColor);
      const rgb = `${Math.round(color.r * 255)}, ${Math.round(color.g * 255)}, ${Math.round(color.b * 255)}`;
      gradient.addColorStop(0, `rgba(${rgb},0.96)`);
      gradient.addColorStop(0.36, `rgba(${rgb},0.44)`);
      gradient.addColorStop(0.62, `rgba(${rgb},0.12)`);
      gradient.addColorStop(1, `rgba(${rgb},0)`);
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 128, 128);
      const texture = new THREE.CanvasTexture(canvas);
      return new THREE.SpriteMaterial({
        map: texture,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
      });
    }

    function addAtmosphere() {
      const starGeom = new THREE.BufferGeometry();
      const starCount = 420;
      const positions = new Float32Array(starCount * 3);
      for (let i = 0; i < starCount; i += 1) {
        positions[i * 3] = (Math.random() - 0.5) * 1400;
        positions[i * 3 + 1] = (Math.random() - 0.5) * 760;
        positions[i * 3 + 2] = (Math.random() - 0.5) * 2000;
      }
      starGeom.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      const starMat = new THREE.PointsMaterial({
        color: 0xbfd0ff,
        size: 1.3,
        transparent: true,
        opacity: 0.34,
        depthWrite: false,
      });
      starField.add(new THREE.Points(starGeom, starMat));

      const mistGeom = new THREE.BufferGeometry();
      const mistCount = 160;
      const mist = new Float32Array(mistCount * 3);
      for (let i = 0; i < mistCount; i += 1) {
        mist[i * 3] = (Math.random() - 0.5) * 760;
        mist[i * 3 + 1] = (Math.random() - 0.5) * 360;
        mist[i * 3 + 2] = (Math.random() - 0.5) * 1200;
      }
      mistGeom.setAttribute("position", new THREE.BufferAttribute(mist, 3));
      const mistMat = new THREE.PointsMaterial({
        color: 0x456bff,
        size: 18,
        transparent: true,
        opacity: 0.045,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
      });
      starField.add(new THREE.Points(mistGeom, mistMat));

      const nebulaPalette = [0x4e6fff, 0x7a63ff, 0xff8c54];
      const nebulaOffsets = [
        new THREE.Vector3(12, 0, 40),
        new THREE.Vector3(108, 18, 182),
        new THREE.Vector3(-124, -18, -32),
      ];
      nebulaPalette.forEach((color, index) => {
        const sprite = new THREE.Sprite(makeGlowSprite(color));
        sprite.position.copy(nebulaOffsets[index]);
        sprite.scale.set(index === 0 ? 420 : 280, index === 0 ? 280 : 220, 1);
        sprite.material.opacity = index === 0 ? 0.22 : 0.16;
        starField.add(sprite);
      });
    }

    function buildLineSegments(edges, positions, options) {
      const vertices = [];
      const colors = [];
      const colorA = new THREE.Color(options.colorA);
      const colorB = new THREE.Color(options.colorB ?? options.colorA);

      for (const edge of edges) {
        const source = positions.get(edge.source);
        const target = positions.get(edge.target);
        if (!source || !target) continue;
        vertices.push(source.x, source.y, source.z, target.x, target.y, target.z);
        colors.push(colorA.r, colorA.g, colorA.b, colorB.r, colorB.g, colorB.b);
      }

      const geom = new THREE.BufferGeometry();
      geom.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));
      geom.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));

      const mat = new THREE.LineBasicMaterial({
        vertexColors: true,
        transparent: true,
        opacity: options.opacity,
        depthWrite: false,
      });
      return new THREE.LineSegments(geom, mat);
    }

    function buildEvolutionTrails(edges, positions, options) {
      const group = new THREE.Group();
      group.userData.materials = [];
      const color = new THREE.Color(options.colorA);

      for (const edge of edges) {
        const source = positions.get(edge.source);
        const target = positions.get(edge.target);
        if (!source || !target) continue;

        const seed = hashNumber(`${edge.source}:${edge.target}`);
        const midpoint = source.clone().lerp(target, 0.5);
        midpoint.y += 18 + Math.abs(target.z - source.z) * 0.08;
        midpoint.x += ((seed % 17) - 8) * 2.2;
        midpoint.z += 10;

        const curve = new THREE.CatmullRomCurve3([source, midpoint, target]);
        const points = curve.getPoints(22);
        const geom = new THREE.BufferGeometry().setFromPoints(points);
        const mat = new THREE.LineBasicMaterial({
          color,
          transparent: true,
          opacity: options.opacity,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
        });
        const line = new THREE.Line(geom, mat);
        group.userData.materials.push(mat);
        group.add(line);
      }

      return group;
    }

    function setGroupOpacity(group, opacity) {
      if (!group) return;
      if (group.userData?.materials?.length) {
        for (const mat of group.userData.materials) mat.opacity = opacity;
        return;
      }
      if (group.material) group.material.opacity = opacity;
    }

    function clearGraph() {
      while (graphGroup.children.length) {
        const child = graphGroup.children.pop();
        child.geometry?.dispose?.();
        child.material?.dispose?.();
      }
      state.nodeMeshes.clear();
      state.glowMeshes.clear();
      state.labelLookup.clear();
      state.relatedByNode.clear();
    }

    function populateDrawer(node) {
      if (!node) {
        titleEl.textContent = "Memory Graph";
        badgesEl.innerHTML = "";
        summaryEl.textContent = "Select a node to inspect its memory meaning, evidence context, evolution position, and related jumps.";
        memoryMetaEl.innerHTML = "";
        jumpListEl.innerHTML = "";
        stateRailEl.innerHTML = "";
        return;
      }

      const layerColor = node.layer in colorByLayer ? colorByLayer[node.layer] : colorByLayer.unknown;
      const layerHex = `#${new THREE.Color(layerColor).getHexString()}`;
      titleEl.textContent = node.summary || node.id;
      badgesEl.innerHTML = [
        `<span class="badge" style="color:${layerHex}; background:${layerHex}18;">${node.layer}</span>`,
        `<span class="badge">${node.role || "memory"}</span>`,
        `<span class="badge">importance ${(node.importance ?? 0.5).toFixed(2)}</span>`,
      ].join("");

      summaryEl.textContent = node.summary || "No summary available.";

      const tags = Array.isArray(node.tags) && node.tags.length ? node.tags.join(", ") : "none";
      const metaRows = [
        ["Node ID", node.id],
        ["Memory Source", node.sourceRef || "(unknown)"],
        ["Tags", tags],
        ["Scores", `hit ${Number(node.hit || 0).toFixed(2)} / adopt ${Number(node.adopt || 0).toFixed(2)} / harm ${Number(node.harm || 0).toFixed(2)}`],
      ];
      memoryMetaEl.innerHTML = metaRows.map(([k, v]) => `<div class="meta-row"><div class="meta-key">${k}</div><div class="meta-value">${v}</div></div>`).join("");

      const related = (state.relatedByNode.get(node.id) || []).slice(0, 6);
      jumpListEl.innerHTML = related.length
        ? related.map((item) => `<button class="jump-item" data-target="${item.targetId}"><div><div class="jump-title">${item.title}</div><div class="jump-subtitle">${item.subtitle}</div></div><div class="jump-cta">jump</div></button>`).join("")
        : `<div class="meta-row"><div class="meta-value">No related jumps available.</div></div>`;

      const prev = state.evolutionGraph.prev.get(node.id) || [];
      const next = state.evolutionGraph.next.get(node.id) || [];
      const railItems = [];
      if (prev.length) {
        for (const prevId of prev.slice(0, 3)) {
          const prevNode = state.labelLookup.get(prevId);
          railItems.push(`<div class="rail-item"><div class="rail-label">previous</div>${prevNode?.summary || prevId}</div>`);
        }
      }
      railItems.push(`<div class="rail-item active"><div class="rail-label">current</div>${node.summary || node.id}</div>`);
      if (next.length) {
        for (const nextId of next.slice(0, 3)) {
          const nextNode = state.labelLookup.get(nextId);
          railItems.push(`<div class="rail-item"><div class="rail-label">next</div>${nextNode?.summary || nextId}</div>`);
        }
      }
      if (!prev.length && !next.length) {
        railItems.push(`<div class="rail-item"><div class="rail-label">state line</div>No explicit evolution line in current data.</div>`);
      }
      stateRailEl.innerHTML = railItems.join("");
    }

    function buildRelatedConnections(nodes, edges) {
      const byNode = new Map(nodes.map((node) => [node.id, []]));
      for (const edge of edges) {
        const sourceNode = state.labelLookup.get(edge.source);
        const targetNode = state.labelLookup.get(edge.target);
        if (!sourceNode || !targetNode) continue;
        const subtitle = edge.type === "supersession" ? "same evolution line" : edge.type === "structural" ? "related memory" : "semantic neighbor";
        const pushItem = (nodeId, targetId) => {
          const list = byNode.get(nodeId) || [];
          list.push({
            targetId,
            title: (state.labelLookup.get(targetId)?.summary || targetId).slice(0, 120),
            subtitle,
          });
          byNode.set(nodeId, list);
        };
        pushItem(edge.source, edge.target);
        pushItem(edge.target, edge.source);
      }
      state.relatedByNode = byNode;
    }

    function focusNode(nodeId, smooth = true) {
      const mesh = state.nodeMeshes.get(nodeId);
      const node = state.labelLookup.get(nodeId);
      if (!mesh || !node) return;
      state.selectedNodeId = nodeId;
      populateDrawer(node);
      updateVisualState();
      const target = mesh.position.clone();
      if (smooth) controls.target.lerp(target, 0.22);
      else controls.target.copy(target);
    }

    function updateVisualState() {
      const selectedId = state.selectedNodeId;
      const selectedPrev = selectedId ? new Set(state.evolutionGraph.prev.get(selectedId) || []) : new Set();
      const selectedNext = selectedId ? new Set(state.evolutionGraph.next.get(selectedId) || []) : new Set();

      for (const [nodeId, mesh] of state.nodeMeshes.entries()) {
        const node = state.labelLookup.get(nodeId);
        const visible = state.layer === "all" || node.layer === state.layer;
        mesh.visible = visible;
        const glow = state.glowMeshes.get(nodeId);
        if (glow) glow.visible = visible;

        const isSelected = nodeId === selectedId;
        const onSelectedLine = selectedPrev.has(nodeId) || selectedNext.has(nodeId);
        const baseScale = mesh.userData.baseScale;
        mesh.scale.setScalar(isSelected ? baseScale * 1.92 : onSelectedLine ? baseScale * 1.34 : baseScale);
        mesh.material.opacity = state.view === "evolution" && !onSelectedLine && !isSelected ? 0.38 : 1;
        if (glow) {
          glow.scale.setScalar(isSelected ? mesh.userData.glowScale * 1.12 : onSelectedLine ? mesh.userData.glowScale * 1.02 : mesh.userData.glowScale);
          glow.material.opacity = isSelected ? 0.74 : onSelectedLine ? 0.46 : 0.22;
        }
      }

      if (state.lineGroups.semantic) {
        state.lineGroups.semantic.visible = state.view !== "evolution";
        setGroupOpacity(state.lineGroups.semantic, state.view === "semantic" ? 0.48 : 0.24);
      }
      if (state.lineGroups.structural) {
        state.lineGroups.structural.visible = state.view !== "evolution";
        setGroupOpacity(state.lineGroups.structural, state.view === "semantic" ? 0.34 : 0.16);
      }
      if (state.lineGroups.evolution) {
        state.lineGroups.evolution.visible = state.view !== "semantic";
        setGroupOpacity(state.lineGroups.evolution, state.view === "evolution" ? 0.96 : 0.72);
      }
    }

    function renderGraph(graphData) {
      clearGraph();
      state.graph = graphData;
      const nodes = graphData.nodes || [];
      const edges = graphData.edges || [];
      const evolutionEdges = edges.filter((edge) => edge.type === "supersession");
      const structuralEdges = edges.filter((edge) => edge.type === "structural");
      const semanticEdges = edges.filter((edge) => edge.type === "associative");

      for (const node of nodes) state.labelLookup.set(node.id, node);
      buildRelatedConnections(nodes, edges);

      const positions = buildPositions(nodes, evolutionEdges);
      state.lineGroups.semantic = buildLineSegments(semanticEdges, positions, { colorA: 0x7b98ff, colorB: 0xb7d7ff, opacity: 0.24 });
      state.lineGroups.structural = buildLineSegments(structuralEdges, positions, { colorA: 0x58d2ab, colorB: 0x7ce9d3, opacity: 0.16 });
      state.lineGroups.evolution = buildEvolutionTrails(evolutionEdges, positions, { colorA: 0xff9d63, opacity: 0.72 });
      graphGroup.add(state.lineGroups.semantic, state.lineGroups.structural, state.lineGroups.evolution);

      for (const node of nodes) {
        const pos = positions.get(node.id);
        const layerColor = colorByLayer[node.layer] || colorByLayer.unknown;
        const size = 8.8 + (node.importance ?? 0.5) * 8.8 + (node.role === "architecture" ? 2.6 : 0);
        const geom = new THREE.SphereGeometry(size, 24, 24);
        const mat = new THREE.MeshPhongMaterial({
          color: layerColor,
          transparent: true,
          opacity: 1,
          shininess: 150,
          emissive: new THREE.Color(layerColor).multiplyScalar(0.58),
        });
        const mesh = new THREE.Mesh(geom, mat);
        mesh.position.copy(pos);
        mesh.userData = { id: node.id, baseScale: 1, glowScale: size * 4.6 };
        state.nodeMeshes.set(node.id, mesh);
        graphGroup.add(mesh);

        const glow = new THREE.Sprite(makeGlowSprite(layerColor));
        glow.position.copy(pos);
        glow.scale.setScalar(size * 4.6);
        glow.material.opacity = 0.22;
        glow.userData = { id: node.id };
        state.glowMeshes.set(node.id, glow);
        graphGroup.add(glow);
      }

      graphGroup.position.set(-40, -6, -64);

      updateVisualState();
      const preferredId = evolutionEdges[0]?.target || evolutionEdges[0]?.source;
      const firstNode = (preferredId && nodes.find((node) => node.id === preferredId))
        || nodes.find((node) => node.layer === "semantic")
        || nodes[0];
      if (firstNode) focusNode(firstNode.id, false);
    }

    function updateChipGroup(containerId, key, value) {
      document.querySelectorAll(`#${containerId} .chip`).forEach((chip) => {
        chip.classList.toggle("active", chip.dataset[key] === value);
      });
    }

    document.getElementById("layer-chips").addEventListener("click", (event) => {
      const chip = event.target.closest(".chip");
      if (!chip) return;
      state.layer = chip.dataset.layer;
      updateChipGroup("layer-chips", "layer", state.layer);
      updateVisualState();
    });

    document.getElementById("view-chips").addEventListener("click", (event) => {
      const chip = event.target.closest(".chip");
      if (!chip) return;
      state.view = chip.dataset.view;
      updateChipGroup("view-chips", "view", state.view);
      updateVisualState();
    });

    document.getElementById("mode-chips").addEventListener("click", (event) => {
      const chip = event.target.closest(".chip");
      if (!chip) return;
      state.mode = chip.dataset.mode;
      updateChipGroup("mode-chips", "mode", state.mode);
    });

    searchEl.addEventListener("input", () => {
      const query = searchEl.value.trim().toLowerCase();
      if (!query || !state.graph) {
        searchResultsEl.classList.remove("visible");
        searchResultsEl.innerHTML = "";
        return;
      }

      const results = state.graph.nodes
        .map((node) => {
          const haystack = [node.id, node.summary, node.sourceRef, ...(node.tags || [])].join(" ").toLowerCase();
          const score = haystack.includes(query) ? (haystack.startsWith(query) ? 2 : 1) : 0;
          return { node, score };
        })
        .filter((item) => item.score > 0)
        .sort((a, b) => b.score - a.score || (b.node.importance || 0) - (a.node.importance || 0))
        .slice(0, 8);

      if (!results.length) {
        searchResultsEl.classList.remove("visible");
        searchResultsEl.innerHTML = "";
        return;
      }

      searchResultsEl.innerHTML = results.map(({ node }) => `<div class="search-item" data-node-id="${node.id}"><div class="search-title">${node.summary || node.id}</div><div class="search-subtitle">${node.layer} / ${node.role || "memory"}</div></div>`).join("");
      searchResultsEl.classList.add("visible");
    });

    searchResultsEl.addEventListener("click", (event) => {
      const item = event.target.closest(".search-item");
      if (!item) return;
      focusNode(item.dataset.nodeId, true);
      searchResultsEl.classList.remove("visible");
      searchResultsEl.innerHTML = "";
      searchEl.value = "";
    });

    jumpListEl.addEventListener("click", (event) => {
      const button = event.target.closest(".jump-item");
      if (!button) return;
      focusNode(button.dataset.target, true);
    });

    window.addEventListener("click", (event) => {
      if (!event.target.closest("#search-wrap")) searchResultsEl.classList.remove("visible");
    });

    function onPointerMove(event) {
      pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;
    }

    function onPointerClick() {
      raycaster.setFromCamera(pointer, camera);
      const intersects = raycaster.intersectObjects(Array.from(state.nodeMeshes.values()));
      if (!intersects.length) return;
      focusNode(intersects[0].object.userData.id, true);
    }

    window.addEventListener("pointermove", onPointerMove);
    window.addEventListener("click", onPointerClick);

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener("resize", onResize);

    async function loadGraph() {
      const response = await fetch("/api/graph");
      if (!response.ok) throw new Error("Failed to load graph data.");
      return response.json();
    }

    function animate() {
      requestAnimationFrame(animate);
      state.animationClock += 0.008;

      if (state.mode === "static") {
        const azimuth = Math.sin(state.animationClock * 0.22) * 0.00065;
        camera.position.applyAxisAngle(new THREE.Vector3(0, 1, 0), azimuth);
      }

      if (state.mode === "dynamic" && state.lineGroups.evolution) {
        const pulse = 0.58 + (Math.sin(state.animationClock * 4.2) + 1) * 0.18;
        state.lineGroups.evolution.material.opacity = state.view === "semantic" ? 0 : pulse;
      }

      const selectedId = state.selectedNodeId;
      for (const [nodeId, glow] of state.glowMeshes.entries()) {
        const phase = (hashNumber(nodeId) % 100) * 0.013;
        const wave = 1 + Math.sin(state.animationClock * 2.4 + phase) * 0.04;
        const base = glow.userData.id === selectedId ? 1.28 : 1;
        glow.scale.setScalar((state.nodeMeshes.get(nodeId)?.userData.glowScale || 18) * wave * base);
      }

      starField.rotation.y += 0.0003;
      controls.update();
      renderer.render(scene, camera);
    }

    addAtmosphere();
    populateDrawer(null);

    loadGraph()
      .then((graphData) => {
        renderGraph(graphData);
        loadingEl.style.display = "none";
      })
      .catch((error) => {
        loadingEl.textContent = error.message;
        console.error(error);
      });

    animate();
  </script>
</body>
</html>
